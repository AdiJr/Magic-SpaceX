name: Pull Request Checks

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - development

jobs:
  lint-and-test:
    name: "Code Quality & Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Linter
        run: ./gradlew lintStageDebug

      - name: Run Unit Tests
        run: ./gradlew testStageDebugUnitTest

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: Lint Report
          path: app/build/reports/lint-results-stageDebug.html
          if-no-files-found: ignore

  mobsfscan:
    name: "MobSF Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

      - name: MobSF Scan
        uses: MobSF/mobsfscan@3d87bc570c4614d705547bddb521395663dba353 #v0.4.5
        with:
          args: '. --html --type android --version --output results.html'

      - name: Archive MobSF report
        uses: actions/upload-artifact@v4
        with:
          name: MobSF scan report
          path: results.html
          if-no-files-found: error
